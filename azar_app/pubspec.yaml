name: azar_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5 #لتخزين الأذكار المفضلة و الاعدادات المستخدم
  intl: ^0.19.0  # لإدارة التواريخ والأوقات
  hijri: ^3.0.0 # لتحويل التواريخ بين الهجري والميلادي
  cupertino_icons: ^1.0.8
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff" # دي بتخلي الخلفية بيضاء عشان اللوجو بتاعى مفرغ